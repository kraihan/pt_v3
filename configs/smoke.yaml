# Tiny CPU configuration for tests: synthetic 8x8x4 latents, 10 classes.
name: smoke
data:
  synthetic: {n: 256, shape: [8, 8, 4], num_classes: 10}
  num_workers: 0
generator:
  cond_dim: 64
  num_classes: 10
  input_size: 8
  in_channels: 4
  out_channels: 4
  patch_size: 2
  hidden_size: 64
  depth: 2
  num_heads: 4
  mlp_ratio: 4.0
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  n_cls_tokens: 2
  use_bf16: false
  attn_fp32: true
  use_remat: false
init:
  wflow_ckpt: ""            # set by the test to a W-Flow-format file
  weights: ema
  noise_code: "fixed:0"
potential:
  hidden_size: 64
  depth: 2
  num_heads: 4
  mlp_ratio: 4.0
  n_cls_tokens: 2
  init_from_generator: true
schedule:
  eps_max: 0.2
  eps_min: 0.1
  eps_schedule: cosine
  anneal_steps: 20
  alpha_def: 0.1
  alpha_degraded: 0.25
  calib_min_steps: 2
  calib_max_steps: 4
  calib_check_every: 2
train:
  seed: 0
  total_steps: 3
  batch_gen: 4
  batch_pot: 4
  K: 4
  w_max: 1.0
  p_uncond: 0.1
  generator_mode: full
  lambda_scale: 0.1
  hutchinson_probes: 1
  lambda_gauge: 0.01
  lambda_curv: 0.1
  curv_batch: 2
  lr_gen: 1.0e-4
  lr_pot: 1.0e-4
  lr_calib: 1.0e-3
  warmup: 2
  ema_gen: 0.99
  ema_pot: 0.99
  grad_clip: 1.0
  log_every: 1
  save_every: 3
  eval_every: 0
